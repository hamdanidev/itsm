name: healthcare-itsm-dev

services:
  pocketbase:
    build:
      context: .
      target: pocketbase
      args:
        PB_VERSION: ${PB_VERSION:-0.40.5}
    image: healthcare-itsm-backend-dev:${PB_VERSION:-0.40.5}
    # Dev only: the bind-mounted code and named data volume need to be
    # writable by the container user on Linux hosts. Production is non-root.
    user: "0:0"
    command: ["--dev"]
    environment:
      TZ: Asia/Jakarta
      APP_ORIGIN: http://localhost:5173,http://127.0.0.1:5173
      AUTOMIGRATE: "true"
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - pocketbase_data_dev:/pb/pb_data
      - ./backend/pb_migrations:/pb/pb_migrations
      - ./backend/pb_hooks:/pb/pb_hooks

volumes:
  pocketbase_data_dev:
    name: ${PB_VOLUME_NAME_DEV:-healthcare_itsm_pb_data_dev}
